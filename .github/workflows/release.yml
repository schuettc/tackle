name: release

# Releases fire on a PREFIXED tag: <tool>/v<semver> (e.g. scratch/v0.15.1).
# Pushing one tag builds and releases exactly one tool — the others are never
# touched. The tag prefix names the tool; the semver is stripped of its leading
# v for the asset filenames and the (future) /dl path + latest pointer.
#
# Assets follow the family distribution contract:
#   <tool>_<os>_<arch>.tar.gz  +  <tool>_<os>_<arch>.tar.gz.sha256 (shasum format)
#   <os> in {darwin,linux}, <arch> in {arm64,amd64}  (Go GOOS/GOARCH)
# The GitHub release is also the invisible durable backing store for the binaries.
#
# Assets are ALSO published to the tools-ops Downloads bucket under
# tackle.tools/dl/<tool>/<version>/ (+ a /dl/<tool>/latest pointer for real
# releases), so `curl tackle.tools/install.sh | sh` can fetch them. The upload
# job assumes the tools-ops ReleaseRole via OIDC — trust is scoped to the
# `release` GitHub environment (declared on the job), not a ref, so it works
# with the prefixed-tag trigger. A prerelease tag (version with a '-', e.g.
# scratch/v1.0.0-rc.1) publishes its versioned path but NEVER moves latest.

on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Parse tool + version from the tag
        id: tag
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/}"        # e.g. scratch/v0.15.1
          tool="${ref%%/*}"                      # scratch
          vertag="${ref#*/}"                     # v0.15.1
          version="${vertag#v}"                  # 0.15.1
          if [ ! -d "cmd/$tool" ]; then
            echo "tag names tool '$tool' but cmd/$tool does not exist" >&2
            exit 1
          fi
          echo "tool=$tool"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tool $version (tag $ref)"

      - name: Cross-compile + package the four targets
        id: build
        env:
          TOOL: ${{ steps.tag.outputs.tool }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in darwin linux; do
            for arch in arm64 amd64; do
              out="dist/${TOOL}_${os}_${arch}"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath -o "$out/$TOOL" "./cmd/$TOOL"
              tarball="dist/${TOOL}_${os}_${arch}.tar.gz"
              tar -C "$out" -czf "$tarball" "$TOOL"
              ( cd dist && shasum -a 256 "${TOOL}_${os}_${arch}.tar.gz" \
                  > "${TOOL}_${os}_${arch}.tar.gz.sha256" )
              rm -rf "$out"
            done
          done
          ls -1 dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ steps.tag.outputs.tool }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TOOL $VERSION" \
            --generate-notes \
            dist/${TOOL}_*.tar.gz dist/${TOOL}_*.tar.gz.sha256

      - name: Configure AWS credentials (downloads)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TACKLE_RELEASE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish binaries to tackle.tools/dl
        env:
          BUCKET: ${{ secrets.TACKLE_DOWNLOADS_BUCKET }}
          TOOL: ${{ steps.tag.outputs.tool }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          for f in dist/${TOOL}_*.tar.gz dist/${TOOL}_*.tar.gz.sha256; do
            base="$(basename "$f")"
            ct=application/gzip
            case "$base" in *.sha256) ct=text/plain ;; esac
            aws s3 cp "$f" "s3://$BUCKET/dl/$TOOL/$VERSION/$base" \
              --cache-control 'public,max-age=31536000,immutable' --content-type "$ct"
          done

      - name: Update latest pointer + invalidate (real releases only)
        env:
          BUCKET: ${{ secrets.TACKLE_DOWNLOADS_BUCKET }}
          TOOL: ${{ steps.tag.outputs.tool }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          # A prerelease version (contains '-', e.g. 1.0.0-rc.1) publishes its
          # versioned path but must never regress/hijack the latest pointer.
          case "$VERSION" in
            *-*) echo "prerelease $VERSION — leaving /dl/$TOOL/latest untouched"; exit 0 ;;
          esac
          printf '%s' "$VERSION" | aws s3 cp - "s3://$BUCKET/dl/$TOOL/latest" \
            --content-type text/plain --cache-control 'public,max-age=60,must-revalidate'
          aws cloudfront create-invalidation \
            --distribution-id E1W6J149JZCAEG --paths "/dl/$TOOL/latest"
