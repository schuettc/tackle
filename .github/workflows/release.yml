name: release

# Releases fire on a PREFIXED tag: <tool>/v<semver> (e.g. scratch/v0.5.4).
# Pushing one tag builds and releases exactly one tool; the others are never
# touched. Built through the family release actions (schuettc/tools-actions:
# release-version in prefixed-tag mode + go-release): signed and notarized
# macOS binaries (Developer ID), a stamp check, the GitHub release, and the
# family download contract at tackle.tools/dl/<tool>/<version>/ with
# /dl/<tool>/latest moved only for a real release. A tag whose version has a
# '-' (scratch/v1.0.0-rc.1) is a pre-release: versioned paths only.

on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: write
  # OIDC: go-release assumes the tools-ops Release role to write to the
  # tackle.tools Downloads bucket. Trust is this repo's `release` environment.
  id-token: write

jobs:
  release:
    # macOS: codesign and notarytool exist nowhere else.
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
      - id: rel
        uses: schuettc/tools-actions/release-version@v0.10.0
        with:
          mode: prefixed-tag
      - uses: schuettc/tools-actions/go-release@v0.10.0
        with:
          binaries: ${{ steps.rel.outputs.tool }}=./cmd/${{ steps.rel.outputs.tool }}
          # One shared version package for every tool in the monorepo.
          ldflags: >-
            -X github.com/schuettc/tackle/internal/version.version={version}
            -X github.com/schuettc/tackle/internal/version.commit={commit}
            -X github.com/schuettc/tackle/internal/version.date={date}
          stamp-check: ${{ steps.rel.outputs.tool }}
          tag: ${{ steps.rel.outputs.tag }}
          version: ${{ steps.rel.outputs.version }}
          commit: ${{ steps.rel.outputs.commit }}
          date: ${{ steps.rel.outputs.date }}
          create: ${{ steps.rel.outputs.create }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          release-title: ${{ steps.rel.outputs.tool }} ${{ steps.rel.outputs.version }}
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-notary-key: ${{ secrets.APPLE_NOTARY_KEY }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          dl-tool: ${{ steps.rel.outputs.tool }}
          dl-role-arn: ${{ secrets.TACKLE_RELEASE_ROLE_ARN }}
          dl-bucket: ${{ secrets.TACKLE_DOWNLOADS_BUCKET }}
          dl-distribution-id: E1W6J149JZCAEG
