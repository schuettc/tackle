name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          # internal/casebook/web/node_modules may contain Go source (flatted);
          # exclude it as galley does.
          unformatted="$(gofmt -l . | grep -v '^internal/casebook/web/node_modules/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: |
          packages="$(go list ./... | grep -v '/casebook/web/node_modules/' || true)"
          go vet $packages
      - name: build all commands
        run: go build ./...
      - name: test
        run: |
          packages="$(go list ./... | grep -v '/casebook/web/node_modules/' || true)"
          go test -race $packages

  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/casebook/web/package-lock.json
      - name: Cache web/node_modules
        uses: actions/cache@v6
        with:
          path: internal/casebook/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('internal/casebook/web/package-lock.json') }}
      - name: Install web dependencies
        working-directory: internal/casebook/web
        run: '[ -d node_modules ] || npm ci'
      - name: Generate kit types
        working-directory: internal/casebook/web
        run: npm run kit-types
      - name: Test
        working-directory: internal/casebook/web
        run: npm test
      - name: Typecheck
        working-directory: internal/casebook/web
        run: npm run typecheck
      - name: Lint
        working-directory: internal/casebook/web
        run: npm run lint
      - name: Format check
        working-directory: internal/casebook/web
        run: npm run fmt:check
      - name: Build
        working-directory: internal/casebook/web
        # npm run build includes node probe.mjs; probe skips gracefully
        # when Chrome is not installed (KIT_BROWSER not set).
        run: npm run build
      - name: Committed assets are not stale
        run: |
          git diff --exit-code -- internal/casebook/serve/assets/casebook.js \
            internal/casebook/serve/assets/casebook.css \
            || { echo "::error::the committed casebook bundle does not match web/ — run 'npm run build' in internal/casebook/web and commit the result"; exit 1; }

  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/casebook/web/package-lock.json
      - name: Cache web/node_modules
        uses: actions/cache@v6
        with:
          path: internal/casebook/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('internal/casebook/web/package-lock.json') }}
      - name: Install web dependencies
        working-directory: internal/casebook/web
        run: '[ -d node_modules ] || npm ci'
      - name: Generate kit types
        working-directory: internal/casebook/web
        run: npm run kit-types
      - name: Install Chromium
        working-directory: internal/casebook/web
        run: node node_modules/playwright-core/cli.js install --with-deps chromium chromium-headless-shell
      - name: Build casebook binary
        run: go build -o bin/casebook ./cmd/casebook
      - name: Probe
        working-directory: internal/casebook/web
        run: npm run probe
        env:
          KIT_BROWSER: required
          CASEBOOK_BIN: ${{ github.workspace }}/bin/casebook
