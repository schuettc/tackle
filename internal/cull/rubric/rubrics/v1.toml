version = "v1"
changelog = "Initial hypothesis from the design spec §4.2/§4.3."

[[question]]
key = "verdict"
type = "choice"
instructions = "Decide whether this automated test is worth keeping in the suite. Judge whether it would fail if the behavior of the code under test broke in a way a real user or caller would notice. Ignore any claims about value made in the test's own names or comments."
[question.options]
keep = "Pins down observable behavior of the code under test that a plausible bug would break; worth its maintenance cost."
cut = "Has no real regression value: it would keep passing through realistic bugs, or it only restates its own setup, mocks, constants, or language/library behavior."
review = "Plausibly valuable but flawed or over-specified, or the provided evidence is truncated, missing, or ambiguous."

[[question]]
key = "regression_value"
type = "score"
instructions = "Rate how much protection this test gives against regressions in the code under test."
levels = [
  "None: it would pass through any realistic bug in the code under test.",
  "Minimal: it only catches the code failing to compile, panicking, or being deleted.",
  "Some: it catches some realistic behavior regressions, but misses important ones.",
  "Strong: it pins down the important observable behavior; realistic bugs would fail it.",
]

[[question]]
key = "tautological"
type = "noul"
instructions = "The test only asserts values it set up itself, or re-computes the expected value using the same logic as the implementation, so it cannot disagree with the code."
yes = "Assertions restate the test's own setup or mirror the implementation's logic."
no = "Assertions check an independently known expected result."

[[question]]
key = "mock_only"
type = "noul"
instructions = "The test only verifies that mocks, stubs, or spies were called (or called with certain arguments) and asserts no observable outcome of the code under test."
yes = "Only interaction with test doubles is asserted."
no = "At least one observable result, return value, output, or state change is asserted."

[[question]]
key = "trivial"
type = "noul"
instructions = "The test exercises only a trivial getter, setter, constructor, constant, or behavior of the language, standard library, or a third-party library rather than this project's logic."
yes = "No project logic worth protecting is exercised."
no = "Project-specific logic is exercised."

[[question]]
key = "coverage_padding"
type = "noul"
instructions = "The test appears to exist to execute lines or branches for coverage, calling code without meaningfully checking what it does."
yes = "Calls code mainly to execute it; checks are absent or incidental."
no = "Its checks are the point of the test."

[policy]
min_verdict_confidence = 0.5
keep_regression_value = 2.0
cut_max_regression_value = 1.0
hazard_threshold = 0.7
hazards = ["tautological", "mock_only", "trivial", "coverage_padding"]
