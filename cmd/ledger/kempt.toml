# kempt manifest for ledger — kept separate from any dotfiles manifest.
#
#   kempt apply   -manifest cmd/ledger/kempt.toml -packages ledger
#   kempt upgrade -manifest cmd/ledger/kempt.toml -packages ledger
#
# -packages ledger is required: without it kempt applies the selection saved by
# your dotfiles `kempt init`, which does not contain "ledger".
# After the first apply: `ledger init <your private data repo remote>` and
# `ledger hooks install` (see internal/ledger/FORMAT.md). Needs kempt >= 0.5.3.

[kempt]
spec = 1

[packages.ledger]
description = "ledger: the fate of every repo, PR, issue, branch and worktree; journals git/gh activity"
only = { os = "darwin" }

  # The binary, from the family download contract (verified against .sha256).
  [[packages.ledger.download]]
  site = "tackle.tools"
  tool = "ledger"
  bin = "ledger"

  # Claude Code: journal Bash tool calls; brief the session on its repo.
  [[packages.ledger.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { PostToolUse = [ { matcher = "Bash", hooks = [ { type = "command", command = "~/.local/bin/ledger record --harness claude" } ] } ] } }

  [[packages.ledger.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { SessionStart = [ { matcher = "startup|resume", hooks = [ { type = "command", command = "~/.local/bin/ledger brief" } ] } ] } }

  # pi: journal bash tool calls with the pi session id, brief the first turn,
  # background `ledger sync --no-github` at session start/end.
  [[packages.ledger.install]]
  pi = ["npm:pi-ledger"]

  # Full sync (including the GitHub refresh) every 30 minutes.
  [[packages.ledger.service]]
  label = "tools.tackle.ledger.sync"
  program = ["/bin/zsh", "-lc", "exec \"$HOME/.local/bin/ledger\" sync"]
  keep-alive = false
  run-at-load = true
  start-interval = 1800
  process-type = "Background"
  session-type = "Aqua"
  stdout = "~/.local/state/ledger/sync.log"
  stderr = "~/.local/state/ledger/sync.log"

  [[packages.ledger.verify]]
  command-exists = "ledger"
